name: Setup
description: Install Bun at the version pinned in package.json, restore the install cache, and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Read the version from the root `packageManager` field so CI and local
        # installs produce the same lockfile.
        bun-version-file: package.json

    - name: Restore bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      # Frozen so a package.json edit without a lockfile update fails here
      # instead of silently resolving to something different from local.
      #
      # bun's own message for this is "lockfile had changes, but lockfile is
      # frozen", which names neither a dependency nor a remedy — so the first
      # place people look is their own diff, which is usually innocent.
      run: |
        bun install --frozen-lockfile || {
          echo "::error title=Lockfile out of date::bun.lock does not match the package.json files. Run 'bun install' locally and commit the updated bun.lock. If your branch changed no dependency, this is main's problem and not yours."
          exit 1
        }

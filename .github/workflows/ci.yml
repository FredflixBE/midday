# Plain CI for the fork: no deploys, no vendor runners.
#
# Deploys are not this workflow's job. Dokploy builds the api and dashboard
# images from GitHub on its own, and the Trigger.dev deploy lives in its own
# workflow (job-system epic). What this file guarantees is that `main` only
# ever contains code that typechecks, lints and passes its tests, and that the
# database schema is applied before anything built from that push can run.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# One run per ref. A newer push to a PR cancels the older run; pushes to main
# queue instead, because a cancelled migrate job is worse than a slow one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ---------------------------------------------------------------------------
  # Apply the schema first. Only on push to main — pull requests never touch
  # the database. Dokploy deploys from the same push, so this job must not
  # wait on anything: the schema has to be in place before the new code is.
  # ---------------------------------------------------------------------------
  migrate:
    name: Migrate database
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Apply pending migrations
        env:
          DATABASE_SESSION_POOLER: ${{ secrets.DATABASE_SESSION_POOLER }}
        run: |
          if [ -z "$DATABASE_SESSION_POOLER" ]; then
            echo "::notice title=Migrate skipped::DATABASE_SESSION_POOLER is not set on this repository; nothing to migrate against."
            exit 0
          fi
          bun run db:migrate

  # ---------------------------------------------------------------------------
  # Build a database from empty, both ways, and run the tests that need one.
  #
  # `check` below runs without TEST_DATABASE_URL, and every database-backed
  # test skips itself when that is unset — so the tests that prove a fresh
  # project can be built at all only ever ran when someone remembered to run
  # them by hand. This is the job that runs them.
  #
  # Pull requests only. It costs a service container and about a minute, and
  # the thing it protects is a schema change, which arrives in a pull request.
  # A push to main that changed the schema was already checked as one.
  # ---------------------------------------------------------------------------
  schema:
    name: Build the database from empty
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # The same image docker-compose.test.yml pins: the schema has vector
        # columns, so plain postgres will not do.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: midday_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/midday_test

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # The same path a real project takes: bootstrap SQL, push, policies,
      # storage, realtime, the auth trigger, the runtime functions and the
      # document triggers.
      - name: Build it the way db:bootstrap does
        run: bun run --cwd packages/db test:e2e:setup

      # The other way in, which the bootstrap never exercises: the migration
      # files, against a database that starts empty.
      - name: Build it again from the migrations alone
        run: bun run --cwd packages/db verify:migrations

      # With TEST_DATABASE_URL set these no longer skip: what the SQL files
      # actually do, and what the RLS policies actually allow.
      - name: Test against it
        run: bun run --cwd packages/db test

  # ---------------------------------------------------------------------------
  # Typecheck, lint and test the whole graph. Turbo only runs `test` in
  # packages that define a test script, so there is nothing to filter here.
  # ---------------------------------------------------------------------------
  check:
    name: Typecheck, lint and test
    # On main this runs after migrate; on pull requests migrate is skipped and
    # this runs alone. `always()` keeps it from being skipped along with migrate.
    needs: [migrate]
    if: >-
      always() &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Before the slow steps, and outside turbo so no cache can replay it:
      # a new package that declares "latest" would not invalidate any existing
      # package's task, so a cached check would pass while the repo regressed.
      - name: Check every dependency names a version
        run: bun scripts/check-dependency-pins.ts

      - name: Typecheck
        run: bunx turbo typecheck

      - name: Lint
        run: bunx turbo lint

      - name: Test
        run: bunx turbo test --continue

# Build the desktop app and publish it as a GitHub Release.
#
# The app is a thin Tauri shell around https://midday.fredflix.be. Dashboard
# features reach desktop users through the ordinary Dokploy deploy, not through
# a new binary, so a release is cut only when the shell itself changes: a push
# to main that touches apps/desktop, or a run by hand. A release per push would
# ship dozens of identical binaries, and once the updater exists (FF-1695) it
# would ask every user to reinstall for nothing.
#
# A pull request that touches the same paths builds both installers and keeps
# them as run artifacts for a week, without releasing anything. That is where a
# Windows compile error shows up: nobody here builds on Windows by hand.
#
# Each release is tagged desktop-v<version> and carries a universal macOS .dmg
# and a Windows NSIS -setup.exe. Neither is code-signed yet (FF-1691); the
# release notes say how to open them anyway.
#
# It also carries what installed copies update from (FF-1695): the macOS
# .app.tar.gz, a .sig for it and for the -setup.exe, and latest.json, which the
# app reads from releases/latest/download/latest.json. That URL only finds it
# while desktop releases are the only releases in this repository: publish
# anything else as latest and every installed copy stops seeing updates.
# The .sig files are made with the updater key (TAURI_SIGNING_PRIVATE_KEY and
# its password, repository secrets). Lose that key and installed copies can
# never update again; they only accept what it signed.
name: Desktop release

on:
  push:
    branches:
      - main
    # Only the shell. packages/desktop-client ships inside the dashboard bundle,
    # not the binary. bun.lock is not watched either: apps/desktop's JS
    # dependencies never reach the binary (the window loads the remote
    # dashboard), and the one that shapes the build, the Tauri CLI, is not worth
    # a release on its own; the next shell change picks it up. Nor is a README.
    paths:
      - "apps/desktop/**"
      - "!apps/desktop/**/*.md"
      - ".github/workflows/desktop-release.yml"
      - ".github/actions/setup/**"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "!apps/desktop/**/*.md"
      - ".github/workflows/desktop-release.yml"
      - ".github/actions/setup/**"
  # For the first release, and for re-running one by hand. Only a run on main
  # publishes; started from any other branch it just builds, like a pull request.
  workflow_dispatch:

# Never two releases at once, and never cancel one in flight: a half-published
# release is worse than a slow queue. (A run still waiting to start is replaced
# by a newer one, which carries the newer shell anyway.) Pull requests only
# build, so a newer push to one may cancel its older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('desktop-release-{0}', github.ref) || 'desktop-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # src-tauri/src/lib.rs bakes this in with option_env!. Without it the release
  # opens http://localhost:3001.
  MIDDAY_APP_URL: https://midday.fredflix.be

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          # major.minor are written by hand in Cargo.toml, which is where Tauri
          # reads the app's version from. The patch is this workflow's run
          # number, so every release is higher than the last without a
          # version-bump commit, which the updater (FF-1695) depends on. Windows
          # stores each part in 16 bits, so the patch must stay under 65536.
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\.[0-9]*"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n 1)
          if [ -z "$base" ]; then
            echo "::error title=No desktop version::Could not read major.minor from apps/desktop/src-tauri/Cargo.toml."
            exit 1
          fi
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Desktop version: $base.${{ github.run_number }}"

  draft:
    name: Draft the release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - name: Create a draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A draft, so a failed build never leaves a public release with one
          # installer missing. The tag is only created when it is published.
          cat > notes.md <<EOF
          The desktop app, version $VERSION. It opens https://midday.fredflix.be; new dashboard features arrive without a new download.

          These builds are not signed yet, so both systems warn the first time.

          **macOS** (Apple Silicon and Intel): open the \`.dmg\` and drag Midday into Applications. The first launch is blocked: open System Settings → Privacy & Security and click **Open Anyway**.

          **Windows**: run the \`-setup.exe\`. When SmartScreen says *Windows protected your PC*, click **More info** → **Run anyway**.
          EOF
          id=$(gh api "repos/${{ github.repository }}/releases" -X POST \
            -f tag_name="desktop-v$VERSION" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="HQ desktop $VERSION" \
            -F body=@notes.md \
            -F draft=true \
            --jq .id)
          echo "release-id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [version, draft]
    # When nothing is released (a pull request, or a manual run off main) the
    # draft job is skipped and the build still runs.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.draft.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Write, to upload to the draft. Job permissions cannot depend on the event,
    # so a same-repository pull request's build holds it too; a fork's is always
    # read-only.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            # One .dmg for Apple Silicon and Intel. The app bundle is listed too:
            # without it there is no .app.tar.gz, which is what the updater
            # installs on macOS.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows
            runner: windows-latest
            rust-targets: ""
            # No MSI: the NSIS installer is all a release needs.
            args: --bundles nsis
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Stamp the version
        shell: bash
        run: |
          # createUpdaterArtifacts is on here rather than in tauri.conf.json, so a
          # local `tauri build` does not need the updater's private key.
          echo '{ "version": "${{ needs.version.outputs.version }}", "bundle": { "createUpdaterArtifacts": true } }' > apps/desktop/src-tauri/tauri.release.conf.json

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the update files. A fork's pull request gets no secrets, and
          # its build fails here: it cannot sign.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          # Empty when nothing is released: the build then uploads nothing.
          releaseId: ${{ needs.draft.outputs.release-id }}
          # The publish job writes latest.json once both builds are in. Each
          # build writing its own would race, and the loser's platform would be
          # missing from it.
          includeUpdaterJson: false

      - name: Keep the installer
        if: needs.draft.result == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}-${{ needs.version.outputs.version }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*-setup.exe.sig
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [version, draft, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check every file is attached, write latest.json, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          repo="${{ github.repository }}"
          # One array, however many pages the listing takes.
          gh api "repos/$repo/releases/$RELEASE_ID/assets" --paginate --jq '.[]' | jq -s . > assets.json
          jq -r '.[].name' assets.json

          # One asset whose name ends with $1, or fail naming what is missing.
          one() {
            name=$(jq -r --arg end "$1" '[.[] | select(.name | endswith($end))][0].name // empty' assets.json)
            if [ -z "$name" ]; then
              echo "::error title=No $1::The draft release has no $2." >&2
              exit 1
            fi
            echo "$name"
          }
          # The text of a .sig asset, which is what latest.json carries.
          signature() {
            id=$(jq -r --arg name "$1" '.[] | select(.name == $name) | .id' assets.json)
            gh api "repos/$repo/releases/assets/$id" -H "Accept: application/octet-stream"
          }
          # Where the asset lives once the release is published and tagged.
          url() {
            printf 'https://github.com/%s/releases/download/desktop-v%s/%s' "$repo" "$VERSION" "$(jq -rn --arg n "$1" '$n|@uri')"
          }

          one .dmg "macOS installer" > /dev/null
          exe=$(one -setup.exe "Windows installer")
          app=$(one .app.tar.gz "macOS update")
          one -setup.exe.sig "signature for the Windows update" > /dev/null
          one .app.tar.gz.sig "signature for the macOS update" > /dev/null

          # Read into variables first: a failing command inside jq's arguments
          # would not stop the step, and latest.json would ship an empty
          # signature that every installed copy rejects.
          mac_sig=$(signature "$app.sig")
          win_sig=$(signature "$exe.sig")
          if [ -z "$mac_sig" ] || [ -z "$win_sig" ]; then
            echo "::error title=Empty signature::A .sig asset came back empty." >&2
            exit 1
          fi

          # One universal .app.tar.gz serves both Mac architectures; the
          # Windows update is the NSIS installer itself.
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$(url "$app")" --arg mac_sig "$mac_sig" \
            --arg win_url "$(url "$exe")" --arg win_sig "$win_sig" \
            '{
              version: $version,
              notes: "HQ desktop \($version)",
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                "darwin-x86_64": { url: $mac_url, signature: $mac_sig },
                "windows-x86_64": { url: $win_url, signature: $win_sig }
              }
            }' > latest.json
          cat latest.json
          gh api "https://uploads.github.com/repos/$repo/releases/$RELEASE_ID/assets?name=latest.json" \
            -X POST -H "Content-Type: application/json" --input latest.json --jq .name

          # make_latest keeps releases/latest, and so latest.json, pointing at
          # the newest desktop build.
          gh api "repos/$repo/releases/$RELEASE_ID" -X PATCH \
            -F draft=false \
            -f make_latest=true \
            --jq .html_url
